<!doctype html>
<html lang="en">
    <head>
        <title>Nintendo TVii</title>
        <script src="/js/jquery-3.7.1.min.js"></script>
        <script src="/js/jsrender.min.js"></script>
    </head>

    <body>
        <table>
            <thead>
                <tr>
                    <th>Title (loc:English)</th>
                    <th>Title (loc:French)</th>
                    <th>No Convert</th>
                    <th>HTML Encode</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody id="movieList"></tbody>
        </table>

        <script id="movieTemplate" type="text/x-jsrender">
            <tr title="{{attr:availability}}">
              <td>{{loc:title lang='EN'}}</td>
              <td>{{loc:title lang='FR'}}</td>
              <td class="synopsis">{{:synopsis}}</td>
              <td class="synopsis">{{>synopsis}}</td>
              <td>${{dec:ticketPrice}}</td>
            </tr>
        </script>

        <script>
            "use strict";
            var movies = [
                {
                    availability: "Available in 'X&Y' Cinemas",
                    title: "Meet Joe Black",
                    synopsis:
                        "The <span class='role'>grim reaper</span> visits" +
                        "<span class='role'>Bill Parrish</span>...",
                    ticketPrice: 23.4,
                },
                {
                    availability: "Available at < 20kms from London",
                    title: "Eyes Wide Shut",
                    synopsis:
                        "Director <span class='director'>Stanley Kubrick's</span> final film:" +
                        "<br/><br/><img src='http://cdn-4.nflximg.com/US/boxshots/large/5670434.jpg'/>",
                    ticketPrice: 18,
                },
            ];

            $.views.converters({
                dec: function (value) {
                    return value.toFixed(2);
                },
                loc: function (value) {
                    var language = this.tagCtx.props.lang;
                    var result = "";

                    switch (language) {
                        case "EN":
                            result = value;
                            break;

                        case "FR":
                            switch (value) {
                                case "Meet Joe Black":
                                    result = "Rencontrez Joe Black";
                                    break;

                                case "Eyes Wide Shut":
                                    result = "Les Yeux Grand Ferm\xE9s";
                                    break;
                            }
                            break;
                    }
                    return result;
                },
            });

            $("#movieList").html($("#movieTemplate").render(movies));
        </script>
    </body>
</html>
